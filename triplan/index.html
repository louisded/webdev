<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1217">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TriPlan">
<title>TriPlan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D1217;
  --surface: #151C23;
  --surface2: #1D2630;
  --line: #2A3541;
  --text: #E8EEF3;
  --text2: #8D9AA8;
  --text3: #5C6977;
  --done: #4CD08A;
  --missed: #F06464;
  --swim: #4FC3F7;
  --bike: #F59E42;
  --run: #F2D04B;
  --brick: #B48CF2;
  --strength: #8FA3B8;
  --r: 12px;
  --gl: max(16px, env(safe-area-inset-left));
  --gr: max(16px, env(safe-area-inset-right));
  --tabh: 60px;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 var(--sans); font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: var(--gl); padding-right: var(--gr); }

/* Barre supérieure */
.top { position: sticky; top: 0; z-index: 20; background: rgba(13,18,23,.94); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; }
.logo { font: 700 22px/1 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
.logo span { color: var(--text2); }
.racepill { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 64%; min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.racepill b { font: 700 16px/1 var(--cond); flex: none; }
.racepill span { color: var(--text2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { padding-top: 14px; padding-bottom: calc(var(--tabh) + 92px + env(safe-area-inset-bottom)); }

/* Bandeaux */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); color: var(--text2); font-size: 13px; }
.banner.warn { border-color: rgba(240,100,100,.5); color: #F5B0B0; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font-weight: 600; text-align: center; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.danger { color: var(--missed); }
.btn.armed { background: var(--missed); border-color: var(--missed); color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .6; cursor: default; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.link { background: none; border: 0; padding: 8px 0; min-height: 36px; color: var(--text2); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.btn svg, .link svg { width: 18px; height: 18px; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Segmenté */
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.seg button { flex: 1 1 0; min-width: 0; min-height: 36px; border: 0; border-radius: 7px; background: none; color: var(--text2); font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }

/* Navigation semaine */
.weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.weeknav .mid { flex: 1; min-width: 0; text-align: center; }
.weeknav h1 { margin: 0; font: 700 24px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.weeknav .sub { color: var(--text2); font-size: 13px; }
.iconbtn { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.iconbtn svg { width: 20px; height: 20px; }
.today-link { display: block; margin: -6px auto 8px; }

/* Résumé */
.summary { padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); margin-bottom: 16px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi .v { font: 700 24px/1.1 var(--cond); }
.kpi .l { color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface2); margin: 12px 0 8px; }
.stack i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text2); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* Jours */
.day { padding: 10px 0; border-top: 1px solid var(--line); }
.dayh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.dayh .dn { font: 600 15px/1 var(--cond); text-transform: uppercase; color: var(--text2); letter-spacing: .05em; }
.dayh .dd { font: 700 20px/1 var(--cond); color: var(--text2); }
.day.today .dn, .day.today .dd { color: var(--text); }
.day.today .dayh::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--done); align-self: center; }
.rest { color: var(--text3); font-size: 14px; }
.dayfoot { display: flex; align-items: center; justify-content: space-between; }
.racebar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 8px; border-radius: 10px; background: linear-gradient(90deg, rgba(232,238,243,.12), rgba(232,238,243,.03)); border: 1px solid var(--line); font-weight: 600; }
.racebar svg { width: 18px; height: 18px; flex: none; }

/* Carte de séance */
.card { display: flex; align-items: stretch; margin-bottom: 8px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.card .cmain { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: none; border: 0; text-align: left; }
.pill { flex: none; min-width: 52px; padding: 4px 6px; border-radius: 6px; font: 700 13px/1.1 var(--cond); letter-spacing: .04em; text-align: center; color: var(--bg); background: var(--c); }
.cbody { min-width: 0; flex: 1; }
.ct { font-weight: 600; }
.cm { color: var(--text2); font-size: 14px; }
.cn { color: var(--text3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cact { color: var(--done); font-size: 13px; font-weight: 600; margin-top: 2px; }
.cbtns { display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.cbtns button { flex: 1; width: 48px; min-height: 40px; border: 0; background: none; color: var(--text3); display: flex; align-items: center; justify-content: center; }
.cbtns button + button { border-top: 1px solid var(--line); }
.cbtns svg { width: 18px; height: 18px; }
.cbtns button.on-done { color: var(--bg); background: var(--done); }
.cbtns button.on-missed { color: #fff; background: var(--missed); }
.card.st-done { border-color: rgba(76,208,138,.45); background: linear-gradient(90deg, rgba(76,208,138,.10), var(--surface) 70%); }
.card.st-missed .ct, .card.st-missed .cm { text-decoration: line-through; color: var(--text3); }
.card.st-missed .pill { opacity: .45; }
.planactions { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }

/* FAB */
.fab { position: fixed; z-index: 25; bottom: calc(var(--tabh) + 16px + env(safe-area-inset-bottom)); right: max(var(--gr), calc((100vw - 560px) / 2 + 16px)); min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--text); color: var(--bg); font: 700 17px/1 var(--cond); letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.fab[hidden] { display: none; }

/* Barre d'onglets */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: rgba(13,18,23,.97); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs .wrap { display: flex; height: var(--tabh); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--text3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--text); }

/* Sections */
.h2 { margin: 22px 0 10px; font: 700 18px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .05em; color: var(--text2); }
.h2:first-child { margin-top: 4px; }
.panel { padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
.muted { color: var(--text2); font-size: 14px; }
.small { font-size: 13px; color: var(--text3); }
.empty { padding: 24px 14px; text-align: center; color: var(--text2); }

/* Objectifs */
.hero .cd { font: 700 56px/1 var(--cond); letter-spacing: .01em; }
.hero .nm { font: 700 22px/1.15 var(--cond); text-transform: uppercase; margin-top: 4px; overflow-wrap: anywhere; }
.hero .meta { color: var(--text2); font-size: 14px; margin-top: 4px; }
.dists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.dists div { padding: 8px; border-radius: 8px; background: var(--surface2); }
.dists b { display: block; font: 700 18px/1.1 var(--cond); }
.dists span { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.ritem { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: left; }
.ritem.past { opacity: .55; }
.ritem .rb { flex: 1; min-width: 0; }
.ritem .rn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .rm { color: var(--text2); font-size: 13px; }
.ritem .rc { font: 700 18px/1 var(--cond); flex: none; }
.prio { flex: none; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font: 700 16px/1 var(--cond); border: 1px solid var(--line); }
.prio.A { background: var(--text); color: var(--bg); border-color: var(--text); }
.prio.B { background: var(--surface2); }
.prio.C { color: var(--text2); }

/* Stats */
.kgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.kgrid .panel { margin: 0; padding: 12px 10px; }
.kgrid .v { font: 700 26px/1.1 var(--cond); }
.kgrid .l { color: var(--text2); font-size: 12px; line-height: 1.2; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--text3); stroke: none; font: 500 10px var(--sans); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th { color: var(--text2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl tr:last-child td { border-bottom: 0; font-weight: 600; }
.tbl .sp { display: inline-flex; align-items: center; gap: 8px; }

/* Formulaires */
.field { margin-bottom: 14px; }
.field > label, .field > .lbl { display: block; margin-bottom: 6px; color: var(--text2); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
textarea.input { min-height: 88px; resize: vertical; }
select.input { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text2) 50%), linear-gradient(135deg, var(--text2) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type="date"].input { -webkit-appearance: none; appearance: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sports { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sports button { min-height: 44px; padding: 4px 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); font: 700 13px/1 var(--cond); letter-spacing: .03em; color: var(--text2); }
.sports button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--bg); }
.err { color: var(--missed); font-size: 14px; font-weight: 600; margin: 0 0 12px; }
.err:empty { display: none; }
.actline { padding: 10px 12px; border-radius: 10px; background: rgba(76,208,138,.10); border: 1px solid rgba(76,208,138,.4); color: var(--done); font-weight: 600; margin-bottom: 8px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.btnrow .btn { flex: 1 1 auto; }

/* Panneau du bas */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-wrap[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); animation: fade .2s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: calc(100% - 24px - env(safe-area-inset-top)); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 8px var(--gr) calc(20px + env(safe-area-inset-bottom)) var(--gl); animation: up .24s ease; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.sheethead h2 { margin: 0; font: 700 22px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Import */
.steps { margin: 0 0 12px; padding-left: 18px; color: var(--text2); font-size: 14px; }
.steps li { margin-bottom: 6px; }
.imp { padding: 12px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line); margin-bottom: 10px; }
.imp.skip { opacity: .6; }
.imph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.imph b { font-weight: 600; }
.tag { padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--text2); font: 600 12px/1.3 var(--cond); letter-spacing: .05em; }
.tag.warn { border-color: rgba(242,208,75,.5); color: var(--run); }
.impg { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px; }
.impg .input { min-height: 40px; padding: 6px 30px 6px 10px; font-size: 15px; }
.impg .val { color: var(--text2); font-size: 14px; white-space: nowrap; }
.choice { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 14px; cursor: pointer; }
.choice input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--text); }
.ferr { padding: 8px 10px; border-radius: 8px; background: rgba(240,100,100,.10); color: #F5B0B0; font-size: 13px; margin-bottom: 6px; overflow-wrap: anywhere; }

/* Analyse */
.antabs { margin-bottom: 12px; }
.antabs { overflow-x: auto; scrollbar-width: none; }
.antabs::-webkit-scrollbar { display: none; }
.antabs button { flex: 1 0 auto; font-size: 13px; padding: 0 10px; }
.anbody .chart svg { display: block; width: 100%; height: auto; }
.anbody .chart text { fill: var(--text3); stroke: none; font: 500 10px var(--sans); }
.h3 { margin: 16px 0 8px; font: 700 15px/1.2 var(--cond); text-transform: uppercase; letter-spacing: .05em; color: var(--text2); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.kv div { padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.kv span { display: block; font-size: 12px; color: var(--text2); }
.kv b { font: 700 18px/1.2 var(--cond); }
.zbars { display: grid; gap: 8px; }
.zrow { display: flex; align-items: center; gap: 10px; }
.zchip { display: inline-block; min-width: 30px; padding: 3px 5px; border-radius: 5px; color: var(--bg); font: 700 13px/1 var(--cond); text-align: center; }
.zmain { flex: 1; min-width: 0; }
.ztrack { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; margin-bottom: 2px; }
.ztrack i { display: block; height: 100%; }
.zval { flex: none; width: 58px; text-align: right; font-weight: 600; font-size: 14px; line-height: 1.2; }
.segline { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 1px; }
.segline span { display: block; min-width: 1px; }
.anbody .tbl { font-size: 13px; }
.anbody .tbl th, .anbody .tbl td { padding: 7px 3px; }

/* Toast */
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--tabh) + 80px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo">Tri<span>Plan</span></div>
    <div id="raceSlot"></div>
  </div>
</header>
<main id="main" class="wrap"></main>
<button type="button" id="fab" class="fab" hidden></button>
<nav class="tabs" id="tabs"></nav>
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  'use strict';

  /* ===== Constantes ===== */
  var VERSION = '0.3';
  var KEY = 'triplan.mobile.v1';
  var TAB_KEY = KEY + '.tab';

  var SPORT_KEYS = ['swim', 'bike', 'run', 'brick', 'strength'];
  var SPORTS = {
    swim: { c: '#4FC3F7', fr: ['Natation', 'NAT'], en: ['Swim', 'SWIM'] },
    bike: { c: '#F59E42', fr: ['Vélo', 'VÉLO'], en: ['Bike', 'BIKE'] },
    run: { c: '#F2D04B', fr: ['Course à pied', 'CAP'], en: ['Run', 'RUN'] },
    brick: { c: '#B48CF2', fr: ['Enchaînement', 'ENCH'], en: ['Brick', 'BRICK'] },
    strength: { c: '#8FA3B8', fr: ['Renforcement', 'RENFO'], en: ['Strength', 'GYM'] }
  };
  var TYPE_KEYS = ['endurance', 'intervals', 'long', 'tempo', 'technique', 'recovery', 'race'];
  var TYPES = {
    fr: { endurance: 'Endurance', intervals: 'Fractionné', long: 'Sortie longue', tempo: 'Tempo / seuil', technique: 'Technique', recovery: 'Récupération', race: 'Compétition' },
    en: { endurance: 'Endurance', intervals: 'Intervals', long: 'Long session', tempo: 'Tempo / threshold', technique: 'Technique', recovery: 'Recovery', race: 'Race' }
  };
  var ZONES = ['', 'Z1', 'Z2', 'Z3', 'Z4', 'Z5'];
  var STATUSES = ['planned', 'done', 'missed'];
  var FORMAT_KEYS = ['sprint', 'olympic', 'half', 'full', 'other'];
  var FORMATS = {
    sprint: { d: [0.75, 20, 5], fr: 'Sprint (S)', en: 'Sprint (S)' },
    olympic: { d: [1.5, 40, 10], fr: 'Olympique (M)', en: 'Olympic (M)' },
    half: { d: [1.9, 90, 21.1], fr: '70.3 (L)', en: '70.3 (L)' },
    full: { d: [3.8, 180, 42.2], fr: 'Ironman (XL)', en: 'Ironman (XL)' },
    other: { d: null, fr: 'Autre', en: 'Other' }
  };

  /* ===== Utilitaires ===== */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function t(k, vars) {
    var s = I18N[S.lang][k];
    if (s == null) s = I18N.fr[k];
    if (s == null) s = k;
    if (vars) s = s.replace(/\{(\w+)\}/g, function (m, n) { return vars[n] != null ? vars[n] : m; });
    return s;
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function locale() { return S.lang === 'fr' ? 'fr-FR' : 'en-GB'; }
  function nf(x, d) {
    var s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
    return S.lang === 'fr' ? s.replace('.', ',') : s;
  }
  function parseNum(v) {
    if (v == null) return NaN;
    var s = String(v).trim().replace(',', '.');
    return s === '' ? NaN : Number(s);
  }

  /* Dates : chaînes ISO, objets Date à midi heure locale */
  function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0, 0); }
  function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayIso() { return isoOf(new Date()); }
  function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return isoOf(d); }
  function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 864e5); }
  function mondayOf(s) { var d = parseD(s); var dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return isoOf(d); }
  function isoWeek(s) {
    var d = parseD(s);
    var dow = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dow + 3);
    var y = d.getFullYear();
    var jan4 = new Date(y, 0, 4, 12);
    var w1 = new Date(jan4); w1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7) + 3);
    return 1 + Math.round((d - w1) / (7 * 864e5));
  }
  function validIso(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var d = parseD(s);
    return !isNaN(d.getTime()) && isoOf(d) === s;
  }
  function fmtDate(s, opts) { return new Intl.DateTimeFormat(locale(), opts).format(parseD(s)); }
  function fmtShort(s) { return fmtDate(s, { day: 'numeric', month: 'short' }); }
  function fmtLong(s) { return fmtDate(s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  function fmtDur(min) {
    min = Math.round(min || 0);
    if (min < 60) return min + ' min';
    var h = Math.floor(min / 60), m = min % 60;
    return h + 'h' + (m ? pad2(m) : '');
  }
  function fmtHours(min) { return nf((min || 0) / 60, 1) + ' h'; }
  function fmtDist(km, sport) {
    if (!km) return '';
    if (sport === 'swim' && km < 10) return Math.round(km * 1000) + ' m';
    return nf(km, km >= 100 ? 0 : 1) + ' km';
  }
  function sportName(k) { return SPORTS[k] ? SPORTS[k][S.lang][0] : ''; }
  function sportShort(k) { return SPORTS[k] ? SPORTS[k][S.lang][1] : '?'; }
  function sportColor(k) { return SPORTS[k] ? SPORTS[k].c : '#5C6977'; }
  function typeName(k) { return TYPES[S.lang][k] || ''; }

    });

  function sampleData(lang) {
    var m0 = mondayOf(todayIso()), today = todayIso();
    // [sport, type, durée, km par heure (démo), zone]
    var pattern = [
      ['strength', 'endurance', 35, 0, ''],
      ['swim', 'technique', 45, 2.4, ''],
      ['bike', 'intervals', 60, 28, 'Z4'],
      ['run', 'endurance', 45, 10, 'Z2'],
      ['swim', 'endurance', 50, 2.6, 'Z2'],
      ['brick', 'endurance', 120, 0, 'Z2'],
      ['run', 'long', 75, 10, 'Z2']
    ];
    var missed = { '-3:3': 1, '-1:2': 1 };
    var sessions = [];
    for (var w = -5; w <= 1; w++) {
      var factor = Math.pow(1.04, w + 5);
      for (var i = 0; i < 7; i++) {
        var p = pattern[i];
        var date = addDays(m0, w * 7 + i);
        var dur = Math.max(5, Math.round(p[2] * factor / 5) * 5);
        var status = 'planned';
        if (date < today) status = missed[w + ':' + i] ? 'missed' : 'done';
        sessions.push({
          id: uid(), date: date, sport: p[0], type: p[1], dur: dur,
          dist: p[3] ? Math.round(p[3] * dur / 60 * 10) / 10 : 0,
          zone: p[4], notes: '', status: status
        });
      }
    }
    var L = I18N[lang];
    return {
      v: 1, lang: lang, sample: true, sessions: sessions,
      races: [
        { id: uid(), date: addDays(m0, 10 * 7 + 6), name: L.sampleRaceA, format: 'olympic', priority: 'A', location: '' },
        { id: uid(), date: addDays(m0, 5 * 7 + 6), name: L.sampleRaceC, format: 'sprint', priority: 'C', location: '' }
      ]
    };
  }

  function renderStats() {

  function chartSvg(weeks) {
    var W = 340, H = 180, pl = 30, pr = 6, pt = 8, pb = 22;
    var pw = W - pl - pr, ph = H - pt - pb;
    var data = weeks.map(function (wk) {
      var end = addDays(wk, 6), d = { wk: wk, planned: 0, total: 0, by: {} };
      sessionsIn(wk, end).forEach(function (s) {
        if (s.status !== 'missed') d.planned += s.dur;
        if (s.status === 'done') { var m = doneDur(s); d.by[s.sport] = (d.by[s.sport] || 0) + m; d.total += m; }
      });
      return d;
    });
    var maxH = 0;
    data.forEach(function (d) { maxH = Math.max(maxH, d.planned / 60, d.total / 60); });
    var step = maxH <= 4 ? 1 : maxH <= 10 ? 2 : maxH <= 25 ? 5 : 10;
    var top = Math.max(step, Math.ceil(maxH / step) * step);
    var y = function (h) { return pt + ph - h / top * ph; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('chartTitle')) + '">';
    for (var g = 0; g <= top + 1e-9; g += step) {
      s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '" stroke="#2A3541" stroke-width="1"/>';
      s += '<text x="' + (pl - 6) + '" y="' + (y(g) + 3.5).toFixed(1) + '" text-anchor="end">' + g + ' h</text>';
    }
    var slot = pw / data.length, bw = Math.min(28, slot * 0.6);
    data.forEach(function (d, i) {
      var cx = pl + slot * i + slot / 2, x = cx - bw / 2, acc = 0;
      SPORT_KEYS.forEach(function (k) {
        if (!d.by[k]) return;
        var h0 = acc / 60, h1 = (acc + d.by[k]) / 60;
        s += '<rect x="' + x.toFixed(1) + '" y="' + y(h1).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, y(h0) - y(h1)).toFixed(1) + '" fill="' + sportColor(k) + '" stroke="none"/>';
        acc += d.by[k];
      });
      if (d.planned > 0) {
        var py = y(d.planned / 60).toFixed(1);
        s += '<line x1="' + (x - 3).toFixed(1) + '" x2="' + (x + bw + 3).toFixed(1) + '" y1="' + py + '" y2="' + py + '" stroke="#E8EEF3" stroke-width="2"/>';
      }
      if (data.length <= 8 || i % 2 === (data.length - 1) % 2) {
        s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + (S.lang === 'fr' ? 'S' : 'W') + isoWeek(d.wk) + '</text>';
      }
    });
    return s + '</svg>';
  }

  /* auto : applique les choix par défaut sans confirmation ; sinon : ouvre l'aperçu d'import */

      + '<label class="choice"><input type="checkbox" data-chg="corosAuto"' + (S.coros.auto ? ' checked' : '') + '><span>' + esc(t('corosAuto')) + '</span></label>'

      + (CO.err ? '<p class="err">' + esc(CO.err) + '</p>' : '')

  }
  function refreshCoros() {

  function corosInit() {

  }
  document.addEventListener('visibilitychange', function () {

  /* ===== Séries détaillées des activités (stockées à part, hors export JSON) ===== */
  var ST_PREFIX = KEY + '.st.', ST_IDX = KEY + '.stidx', ST_MAX = 60;
  var memStreams = {};
  function streamIdx() {
    try { var v = JSON.parse(window.localStorage.getItem(ST_IDX) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function validStream(st) {
    return st && typeof st === 'object' && st.v === 1 && st.step >= 1 && isFinite(st.t0) &&
      ['sp', 'hr', 'pw'].every(function (k) { return st[k] == null || Array.isArray(st[k]); });
  }
  function saveStream(key, st) {
    if (!validStream(st)) return;
    memStreams[key] = st;
    var idx = streamIdx().filter(function (k) { return k !== key; });
    idx.push(key);
    while (idx.length > ST_MAX) { try { window.localStorage.removeItem(ST_PREFIX + idx.shift()); } catch (e) { /* ignoré */ } }
    var json = JSON.stringify(st);
    for (var tries = 0; tries < 8; tries++) {
      try {
        window.localStorage.setItem(ST_PREFIX + key, json);
        window.localStorage.setItem(ST_IDX, JSON.stringify(idx));
        return;
      } catch (e) {
        if (idx.length <= 1) return; // quota : on garde la série en mémoire pour cette session
        try { window.localStorage.removeItem(ST_PREFIX + idx.shift()); } catch (e2) { return; }
      }
    }
  }
  function loadStream(key) {
    if (!key) return null;
    if (memStreams[key]) return memStreams[key];
    try {
      var st = JSON.parse(window.localStorage.getItem(ST_PREFIX + key) || 'null');
      if (validStream(st)) { memStreams[key] = st; return st; }
    } catch (e) { /* ignoré */ }
    return null;
  }
  function dropStream(key) {
    delete memStreams[key];
    try {
      window.localStorage.removeItem(ST_PREFIX + key);
      window.localStorage.setItem(ST_IDX, JSON.stringify(streamIdx().filter(function (k) { return k !== key; })));
    } catch (e) { /* ignoré */ }
  }
  function pruneStreams() {
    var used = {};
    S.sessions.forEach(function (s) { if (s.act) used[s.act.key] = 1; });
    streamIdx().forEach(function (k) { if (!used[k]) dropStream(k); });
    Object.keys(memStreams).forEach(function (k) { if (!used[k]) delete memStreams[k]; });
  }

  /* ===== Calculs ===== */
  function rolling(arr, w) {
    if (w <= 1) return arr.slice();
    var out = new Array(arr.length), sum = 0, n = 0, half = Math.floor(w / 2);
    var q = [];
    for (var i = 0; i < arr.length + half; i++) {
      var add = i < arr.length ? arr[i] : null;
      q.push(add);
      if (add != null) { sum += add; n++; }
      if (q.length > w) { var rm = q.shift(); if (rm != null) { sum -= rm; n--; } }
      var c = i - half;
      if (c >= 0 && c < arr.length) out[c] = arr[c] == null || !n ? null : sum / n;
    }
    return out;
  }
  /* meilleure moyenne glissante sur `sec` secondes (null compté 0 : pauses incluses) */
  function bestMean(arr, step, sec) {
    var w = Math.round(sec / step);
    if (!arr || w < 1 || arr.length < w) return null;
    var sum = 0, best = -1;
    for (var i = 0; i < arr.length; i++) {
      sum += arr[i] || 0;
      if (i >= w) sum -= arr[i - w] || 0;
      if (i >= w - 1 && sum > best) best = sum;
    }
    return best / w;
  }
  function meanOf(arr) {
    var s = 0, n = 0;
    (arr || []).forEach(function (v) { if (v != null) { s += v; n++; } });
    return n ? s / n : null;
  }
  function maxOf(arr) {
    var m = null;
    (arr || []).forEach(function (v) { if (v != null && (m == null || v > m)) m = v; });
    return m;
  }
  function normPower(st) {
    if (!st.pw) return null;
    var r = rolling(st.pw.map(function (v) { return v || 0; }), Math.max(1, Math.round(30 / st.step)));
    var s = 0, n = 0;
    r.forEach(function (v) { if (v != null) { s += Math.pow(v, 4); n++; } });
    return n ? Math.pow(s / n, 0.25) : null;
  }

  /* Daniels & Gilbert : coût en O2 à la vitesse v (m/min) et fraction de VO2max soutenable pendant t (min) */
  function vo2At(v) { return -4.60 + 0.182258 * v + 0.000104 * v * v; }
  function pctAt(t) { return 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t); }
  function speedAtVo2(vo2) { var a = 0.000104, b = 0.182258, c = -4.60 - vo2; return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); }

  function historyStreams(sport, endIso, days) {
    var from = addDays(endIso, -days), out = [];
    S.sessions.forEach(function (s) {
      if (s.status !== 'done' || !s.act || s.date < from || s.date > endIso) return;
      if (sport && s.sport !== sport) return;
      var st = loadStream(s.act.key);
      if (st) out.push(st);
    });
    return out;
  }
  /* valeurs de référence : saisie manuelle (Réglages) prioritaire, sinon estimation automatique */
  function estimates(endIso) {
    var a = autoEstimates(endIso), z = S.zones;
    return {
      ftp: z.ftp || a.ftp, vdot: z.vdot || a.vdot, hrmax: z.hrmax || a.hrmax,
      man: { ftp: !!z.ftp, vdot: !!z.vdot, hrmax: !!z.hrmax }
    };
  }
  var estCache = {};
  function autoEstimates(endIso) {
    var ck = endIso + '|' + S.sessions.length + '|' + Object.keys(memStreams).length + '|' + streamIdx().length;
    if (estCache.k === ck) return estCache.v;
    var best20 = 0;
    historyStreams('bike', endIso, 90).forEach(function (st) { var b = bestMean(st.pw, st.step, 1200); if (b > best20) best20 = b; });
    var vdot = 0;
    historyStreams('run', endIso, 90).forEach(function (st) {
      if (!st.sp) return;
      [6, 12, 20, 30, 45, 60].forEach(function (min) {
        var b = bestMean(st.sp, st.step, min * 60);
        if (b == null) return;
        var v = b / 100 * 60; // m/min
        if (v < 110) return; // < 6,6 km/h : marche, ignoré
        var vd = vo2At(v) / pctAt(min);
        if (vd > vdot && vd < 90) vdot = vd;
      });
    });
    var hrmax = 0;
    historyStreams(null, endIso, 365).forEach(function (st) {
      if (!st.hr) return;
      var m = maxOf(rolling(st.hr, Math.max(1, Math.round(5 / st.step))));
      if (m && m > hrmax && m < 230) hrmax = m;
    });
    estCache = { k: ck, v: { ftp: best20 ? Math.round(best20 * 0.95) : null, vdot: vdot ? Math.round(vdot * 10) / 10 : null, hrmax: hrmax ? Math.round(hrmax) : null } };
    return estCache.v;
  }

  /* Modèle de zones Z1–Z5 : seuils (4 bornes) sur la métrique de référence */
  function zoneModel(s, st) {
    var est = estimates(s.date);
    if (s.sport === 'bike' && st.pw && est.ftp) {
      return { kind: 'pw', arr: st.pw, th: [0.56, 0.76, 0.91, 1.06].map(function (p) { return p * est.ftp; }), smooth: 30, basis: t(est.man.ftp ? 'zBasisPwM' : 'zBasisPw', { ftp: est.ftp }) };
    }
    if (s.sport === 'run' && st.sp && est.vdot) {
      var th = [0.59, 0.74, 0.84, 0.94].map(function (p) { return speedAtVo2(p * est.vdot) * 100 / 60; });
      return { kind: 'sp', arr: st.sp, th: th, smooth: 30, basis: t(est.man.vdot ? 'zBasisSpM' : 'zBasisSp', { v: nf(est.vdot, 1), tp: fmtPace(speedAtVo2(0.86 * est.vdot) * 100 / 60) }) };
    }
    if (st.hr && est.hrmax) return hrModel(st, est);
    return null;
  }
  function hrModel(st, est) {
    return { kind: 'hr', arr: st.hr, th: [0.6, 0.7, 0.8, 0.9].map(function (p) { return p * est.hrmax; }), smooth: 10, basis: t(est.man.hrmax ? 'zBasisHrM' : 'zBasisHr', { hr: est.hrmax }) };
  }
  function zoneOf(v, th) { var z = 0; while (z < 4 && v >= th[z]) z++; return z; }
  function timeInZones(model, step) {
    var arr = model.kind === 'pw' ? rolling(model.arr, Math.max(1, Math.round(5 / step))) : model.arr;
    var secs = [0, 0, 0, 0, 0];
    arr.forEach(function (v) { if (v != null) secs[zoneOf(v, model.th)] += step; });
    return secs;
  }
  /* Détection d'intervalles : lissage, classement par zone, fusion des segments trop courts */
  function detectSegments(model, step) {
    var sm = rolling(model.arr, Math.max(1, Math.round(model.smooth / step)));
    var segs = [];
    sm.forEach(function (v, i) {
      var z = v == null ? -1 : zoneOf(v, model.th);
      var last = segs[segs.length - 1];
      if (last && last.z === z) last.i1 = i + 1; else segs.push({ z: z, i0: i, i1: i + 1 });
    });
    var minLen = Math.max(1, Math.round(45 / step));
    for (;;) {
      var idx = -1, shortest = Infinity;
      segs.forEach(function (sg, i) { var l = sg.i1 - sg.i0; if (l < minLen && l < shortest && segs.length > 1) { shortest = l; idx = i; } });
      if (idx < 0) break;
      var sg = segs[idx], prev = segs[idx - 1], next = segs[idx + 1];
      var target = !prev ? next : !next ? prev : (Math.abs(prev.z - sg.z) <= Math.abs(next.z - sg.z) ? prev : next);
      target.i0 = Math.min(target.i0, sg.i0);
      target.i1 = Math.max(target.i1, sg.i1);

      for (var j = segs.length - 1; j > 0; j--) {

      }

    return segs;
  }
  function sliceMean(arr, i0, i1) { return arr ? meanOf(arr.slice(i0, i1)) : null; }

  /* ===== Formats ===== */
  function fmtPace(cms) {
    if (!cms || cms <= 0) return '–';
    var sec = Math.round(1000 / (cms / 100));
    if (sec >= 3600) return '–';
    return Math.floor(sec / 60) + ':' + pad2(sec % 60) + ' /km';
  }
  function fmtPace100(cms) {
    if (!cms || cms <= 0) return '–';
    var sec = Math.round(100 / (cms / 100));
    return Math.floor(sec / 60) + ':' + pad2(sec % 60) + ' /100 m';
  }
  function fmtKmh(cms) { return cms == null ? '–' : nf(cms * 0.036, 1) + ' km/h'; }
  function fmtClock(sec) {
    sec = Math.round(sec);
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s);
  }
  function fmtMetric(kind, v, sport) {
    if (v == null) return '–';
    if (kind === 'pw') return Math.round(v) + ' W';
    if (kind === 'hr') return Math.round(v) + ' bpm';
    if (sport === 'run') return fmtPace(v);
    if (sport === 'swim') return fmtPace100(v);
    return fmtKmh(v);
  }
  var ZCOL = ['#6B8BA4', '#4CD08A', '#F2D04B', '#F59E42', '#F06464'];

  /* ===== Graphique en ligne (SVG) ===== */
  function niceStep(range, target) {
    var raw = range / target, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  }
  function lineChart(o) {
    var W = 340, H = 180, pl = 40, pr = 8, pt = 10, pb = o.ribbon ? 30 : 22;
    var pw = W - pl - pr, ph = H - pt - pb;
    var arr = o.arr, n = arr.length, totalSec = n * o.step;
    var buckets = Math.min(n, 320), per = n / buckets, pts = [];
    for (var b = 0; b < buckets; b++) {
      var m = meanOf(arr.slice(Math.floor(b * per), Math.max(Math.floor(b * per) + 1, Math.floor((b + 1) * per))));

      if (o.ribbon) s += '<rect x="' + x0.toFixed(1) + '" y="' + (H - pb + 4) + '" width="' + Math.max(0.5, x1 - x0).toFixed(1) + '" height="6" fill="' + bd.c + '" stroke="none"/>';
    });

      s += '<text x="' + (pl - 5) + '" y="' + (y(g) + 3.5).toFixed(1) + '" text-anchor="end">' + esc(o.yFmt(g)) + '</text>';

    }
    (o.refs || []).forEach(function (r) {
      var yr = y(o.map(r.v)).toFixed(1);
      s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yr + '" y2="' + yr + '" stroke="#E8EEF3" stroke-width="1" stroke-dasharray="4 3"/>';
      s += '<text x="' + (W - pr) + '" y="' + (yr - 3) + '" text-anchor="end" style="fill:#E8EEF3">' + esc(r.label) + '</text>';
    });
    var d = '', pen = false;
    pts.forEach(function (v, i) {
      if (v == null) { pen = false; return; }
      d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1);
      pen = true;
    });
    s += '<path d="' + d + '" stroke="' + o.color + '" stroke-width="1.6" fill="none"/>';
    return s + '</svg>';
  }

  /* ===== Panneau d'analyse ===== */
  function openAnalysis(id) {
    var s = findSession(id);
    if (!s || !s.act) return;
    var st = loadStream(s.act.key);
    UI.an = { id: id, tab: null, loading: false, err: '' };
    if (UI.sheet) { UI.sheet = 'analysis'; UI.armed = null; renderSheet(); $('sheet').scrollTop = 0; }
    else openSheet('analysis');
    if (!st && s.act.cid && CO.mcp) corosLoadDetail(s);
  }
  function analysisTabs(s, st) {
    var tabs = [];

    if (st.hr) tabs.push('hr');
    if (st.pw) tabs.push('power');
    if (zoneModel(s, st)) tabs.push('zones', 'intervals');
    return tabs;
  }
  function analysisSheet() {
    var s = findSession(UI.an.id);
    if (!s || !s.act) return sheetHead(t('anTitle')) + '<p class="muted">' + esc(t('anNoData')) + '</p>';
    var when = fmtDate(s.date, { weekday: 'long', day: 'numeric', month: 'long' });
    var h = sheetHead(t('anTitle'));
    h += '<div class="imph" style="margin-top:-6px"><span class="pill" style="--c:' + sportColor(s.sport) + '">' + esc(sportShort(s.sport)) + '</span><b>' + esc(when) + '</b><span class="tag">' + esc(s.act.fmt) + '</span></div>';
    h += '<p class="muted" style="margin:0 0 12px">' + esc(actLabel(s.act, s.sport)) + '</p>';
    var st = loadStream(s.act.key);
    if (!st) {
      if (UI.an.loading) return h + '<p class="muted" role="status">' + esc(t('anLoading')) + '</p>';
      if (UI.an.err) h += '<p class="err">' + esc(UI.an.err) + '</p>';
      h += '<p class="muted">' + esc(t('anNoData')) + '</p>';
      if (s.act.cid && CO.mcp) h += '<button type="button" class="btn primary block" data-act="anLoadCoros">' + esc(t('anLoadCoros')) + '</button>';
      else h += '<p class="small">' + esc(t('anReimport')) + '</p>';
      return h;
    }
    var tabs = analysisTabs(s, st);
    if (!tabs.length) return h + '<p class="muted">' + esc(t('anNoData')) + '</p>';
    if (tabs.indexOf(UI.an.tab) < 0) UI.an.tab = tabs[0];
    var lbl = { speed: 'anSpeed', hr: 'anHr', zones: 'anZones', power: 'anPower', intervals: 'anIntervals' };
    h += '<div class="seg antabs" role="tablist">' + tabs.map(function (k) {
      return '<button type="button" role="tab" data-act="anTab" data-v="' + k + '" aria-pressed="' + (UI.an.tab === k) + '" aria-selected="' + (UI.an.tab === k) + '">' + esc(t(lbl[k])) + '</button>';
    }).join('') + '</div>';
    h += '<div class="anbody">' + analysisBody(s, st, UI.an.tab) + '</div>';
    return h;
  }
  function kv(pairs) {
    return '<div class="kv">' + pairs.map(function (p) { return '<div><span>' + esc(p[0]) + '</span><b>' + esc(p[1]) + '</b></div>'; }).join('') + '</div>';
  }
  function analysisBody(s, st, tab) {
    var h = '';
    var model = zoneModel(s, st);
    if (tab === 'speed') {
      var sm = rolling(st.sp, Math.max(1, Math.round(10 / st.step)));
      var refs = [];
      if (model && model.kind === 'sp') refs.push({ v: speedAtVo2(0.86 * estimates(s.date).vdot) * 100 / 60, label: 'T' });
      h += '<div class="chart">' + lineChart({ arr: sm, step: st.step, color: sportColor(s.sport), map: function (v) { return v * 0.036; }, zero: true, yFmt: function (v) { return nf(v, 0); }, refs: refs, label: t('anSpeed') }) + '</div>';
      h += '<p class="small" style="margin:4px 0 10px">' + esc(t('anSpeedAxis')) + '</p>';
      var avg = meanOf(st.sp.filter(function (v) { return v != null && v > 30; })), mx = maxOf(sm);
      var pairs = [[t('anAvg'), fmtKmh(avg)], [t('anMax'), fmtKmh(mx)]];

      h += '<p class="small" style="margin:4px 0 10px">' + esc(t('anHrAxis')) + '</p>';
      h += kv([[t('anAvg'), fmtMetric('hr', meanOf(st.hr))], [t('anMax'), fmtMetric('hr', maxOf(st.hr))], [t('anHrMax'), est.hrmax ? est.hrmax + ' bpm' : '–']]);
    } else if (tab === 'power') {
      var ftp = estimates(s.date).ftp;
      var ps = rolling(st.pw, Math.max(1, Math.round(10 / st.step)));
      h += '<div class="chart">' + lineChart({ arr: ps, step: st.step, color: '#B48CF2', map: function (v) { return v; }, zero: true, yFmt: function (v) { return Math.round(v); }, refs: ftp && s.sport === 'bike' ? [{ v: ftp, label: 'FTP ' + ftp + ' W' }] : [], label: t('anPower') }) + '</div>';
      h += '<p class="small" style="margin:4px 0 10px">' + esc(t('anPowerAxis')) + '</p>';
      var np = normPower(st), avgp = meanOf(st.pw);
      var pairs2 = [[t('anAvg'), fmtMetric('pw', avgp)], [t('anNp'), fmtMetric('pw', np)]];
      if (ftp && s.sport === 'bike' && np) pairs2.push([t('anIf'), nf(np / ftp, 2)]);
      h += kv(pairs2);
      h += '<h3 class="h3">' + esc(t('anCurve')) + '</h3><table class="tbl"><tbody>';
      [[5, '5 s'], [60, '1 min'], [300, '5 min'], [1200, '20 min'], [3600, '60 min']].forEach(function (d) {
        var b = bestMean(st.pw, st.step, d[0]);
        if (b != null) h += '<tr><td>' + d[1] + '</td><td>' + Math.round(b) + ' W</td></tr>';
      });
      h += '</tbody></table>';
      if (s.sport !== 'bike') h += '<p class="small">' + esc(t('anPowerNonBike')) + '</p>';
    } else if (tab === 'zones') {
      var secs = timeInZones(model, st.step), tot = secs.reduce(function (a, b) { return a + b; }, 0) || 1;
      h += '<p class="small" style="margin:0 0 10px">' + esc(model.basis) + '</p>';
      h += zoneBars(secs, tot, model, s.sport);
      if (model.kind !== 'hr' && st.hr && estimates(s.date).hrmax) {
        var hm2 = hrModel(st, estimates(s.date)), secs2 = timeInZones(hm2, st.step);
        h += '<h3 class="h3">' + esc(t('anHrZones')) + '</h3><p class="small" style="margin:0 0 10px">' + esc(hm2.basis) + '</p>';
        h += zoneBars(secs2, secs2.reduce(function (a, b) { return a + b; }, 0) || 1, hm2, s.sport);
      }
    } else if (tab === 'intervals') {
      var segs2 = detectSegments(model, st.step);
      var sm2 = rolling(model.arr, Math.max(1, Math.round(10 / st.step)));
      var isSp = model.kind === 'sp';
      h += '<p class="small" style="margin:0 0 6px">' + esc(model.basis) + '</p>';
      h += '<div class="chart">' + lineChart({
        arr: sm2, step: st.step, color: '#E8EEF3', ribbon: true, zero: model.kind !== 'hr',
        map: isSp ? function (v) { return v * 0.036; } : function (v) { return v; },
        yFmt: function (v) { return Math.round(v); },
        bands: segs2.filter(function (g) { return g.z >= 0; }).map(function (g) { return { i0: g.i0, i1: g.i1, c: ZCOL[g.z], op: 0.22 }; }),
        label: t('anIntervals')
      }) + '</div>';
      h += '<p class="small" style="margin:4px 0 10px">' + esc(t(model.kind === 'pw' ? 'anPowerAxis' : model.kind === 'hr' ? 'anHrAxis' : 'anSpeedAxis')) + ' · ' + esc(t('anRibbon')) + '</p>';
      var efforts = segs2.filter(function (g) { return g.z >= 3; });
      h += '<h3 class="h3">' + esc(t('anEfforts', { n: efforts.length })) + '</h3>';
      if (!efforts.length) h += '<p class="muted">' + esc(t('anNoEfforts')) + '</p>';
      else {
        h += '<table class="tbl"><thead><tr><th>#</th><th>' + esc(t('anStart')) + '</th><th>' + esc(t('anDur')) + '</th><th>' + esc(t('zone')) + '</th><th>' + esc(t('anAvg')) + '</th><th>' + esc(t('anHr')) + '</th></tr></thead><tbody>';
        efforts.forEach(function (g, i) {
          h += '<tr><td>' + (i + 1) + '</td><td>' + fmtClock(g.i0 * st.step) + '</td><td>' + fmtClock((g.i1 - g.i0) * st.step) + '</td><td><span class="zchip" style="background:' + ZCOL[g.z] + '">Z' + (g.z + 1) + '</span></td><td>' + esc(fmtMetric(model.kind, sliceMean(model.arr, g.i0, g.i1), s.sport)) + '</td><td>' + esc(st.hr ? fmtMetric('hr', sliceMean(st.hr, g.i0, g.i1)) : '–') + '</td></tr>';
        });
        h += '</tbody></table>';
      }
      h += '<h3 class="h3">' + esc(t('anSegments')) + '</h3><div class="segline">' + segs2.filter(function (g) { return g.z >= 0; }).map(function (g) {
        return '<span style="background:' + ZCOL[g.z] + ';flex:' + (g.i1 - g.i0) + '" title="Z' + (g.z + 1) + ' · ' + fmtClock((g.i1 - g.i0) * st.step) + '"></span>';
      }).join('') + '</div>';
    }
    return h;
  }
  function zoneBars(secs, tot, model, sport) {
    var h = '<div class="zbars">';
    secs.forEach(function (sec, z) {
      var lo = z === 0 ? null : model.th[z - 1], hi = z === 4 ? null : model.th[z], range;
      if (model.kind === 'sp' && sport === 'run') {
        range = z === 0 ? '> ' + fmtPace(hi) : z === 4 ? '< ' + fmtPace(lo) : fmtPace(hi).replace(' /km', '') + '–' + fmtPace(lo);
      } else {
        range = lo == null ? '< ' + fmtMetric(model.kind, hi, sport) : hi == null ? '≥ ' + fmtMetric(model.kind, lo, sport)
          : fmtMetric(model.kind, lo, sport).replace(/ .*/, '') + '–' + fmtMetric(model.kind, hi, sport);
      }
      h += '<div class="zrow"><span class="zchip" style="background:' + ZCOL[z] + '">Z' + (z + 1) + '</span>'
        + '<div class="zmain"><div class="ztrack"><i style="width:' + (sec / tot * 100).toFixed(1) + '%;background:' + ZCOL[z] + '"></i></div><span class="small">' + esc(range) + '</span></div>'
        + '<span class="zval">' + esc(fmtDur(sec / 60)) + '<br><span class="small">' + Math.round(sec / tot * 100) + ' %</span></span></div>';
    });
    return h + '</div>';
  }

  /* Détail COROS : fichier FIT original via le connecteur (outil downloadActivityFitFiles) */
  function b64ToBuf(b64) {
    var bin = atob(b64.replace(/\s+/g, '')), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }
  function findBlob(res) {
    var blocks = (res && res.content) || [];
    for (var i = 0; i < blocks.length; i++) {
      var c = blocks[i] || {};
      var b = (c.resource && c.resource.blob) || c.blob || (c.type !== 'text' && c.type !== 'image' ? c.data : null);
      if (typeof b === 'string' && b.length > 16) return b;
    }
    return null;
  }
  function corosDetailFetch(act) {
    return CO.mcp.callTool(COROS_SERVER, 'downloadActivityFitFiles', { labelId: act.cid, sportType: act.ct, limit: 1 }, { cache: false })
      .then(function (res) {
        var b64 = findBlob(res);
        if (!b64) throw new Error('format');
        var acts = parseFit(b64ToBuf(b64));
        var withStream = acts.filter(function (a) { return a.stream; });
        if (!withStream.length) throw new Error('nosession');
        saveStream(act.key, withStream[0].stream);
      });
  }
  function corosLoadDetail(s) {
    UI.an.loading = true;
    UI.an.err = '';
    if (UI.sheet === 'analysis') renderSheet();
    corosDetailFetch(s.act).then(function () {
      UI.an.loading = false;
      if (UI.sheet === 'analysis') renderSheet();
    }, function (e) {
      UI.an.loading = false;
      UI.an.err = e && e.code ? corosErr(e) : t('anCorosFail');
      if (UI.sheet === 'analysis') renderSheet();
    });
  }
  /* après une synchro auto : récupère le détail des nouvelles activités COROS (5 max), l'une après l'autre */
  function corosFetchDetails(acts) {
    var queue = acts.filter(function (a) { return a.cid && !loadStream(a.key); }).slice(-5);
    (function next() {
      var a = queue.shift();
      if (!a || !CO.mcp) return;
      corosDetailFetch(a).then(next, next);
    })();
  }

  /* ===== Confirmation en deux temps ===== */
  var armTimer = null;
  function confirmStep(key, el) {
    if (UI.armed === key) { UI.armed = null; clearTimeout(armTimer); return true; }
    disarmAll();
    UI.armed = key;
    el.textContent = el.getAttribute('data-confirm');
    el.classList.add('armed');
    clearTimeout(armTimer);
    armTimer = setTimeout(disarmAll, 4000);
    return false;
  }
  function disarmAll() {
    UI.armed = null;
    Array.prototype.forEach.call(document.querySelectorAll('.armed'), function (el) {
      el.classList.remove('armed');
      if (el.getAttribute('data-label')) el.textContent = el.getAttribute('data-label');
    });
  }

  /* ===== Toast ===== */
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  /* ===== Actions ===== */
  function setTab(tab) {
    UI.tab = tab;
    storageSet(TAB_KEY, tab);
    UI.armed = null;
    render();
    window.scrollTo(0, 0);
  }
  function setStatus(id, status) {
    var s = findSession(id);
    if (!s) return;
    s.status = s.status === status ? 'planned' : status;
    touch(); persist(); render();
  }

  var actions = {
    goTab: function (el) { setTab(el.getAttribute('data-tab')); },
    weekPrev: function () { UI.week = addDays(UI.week, -7); render(); },
    weekNext: function () { UI.week = addDays(UI.week, 7); render(); },
    weekToday: function () { UI.week = mondayOf(todayIso()); render(); },
    clearSample: function () {
      S.sessions = []; S.races = []; S.sample = false;
      persist(); pruneStreams(); render(); toast(t('sampleCleared'));
    },
    toggleDone: function (el) { setStatus(el.getAttribute('data-id'), 'done'); },
    toggleMissed: function (el) { setStatus(el.getAttribute('data-id'), 'missed'); },
    newSession: function (el) {
      var d = el.getAttribute('data-date');
      if (!d) {
        var today = todayIso();
        d = (today >= UI.week && today <= addDays(UI.week, 6)) ? today : UI.week;
      }
      openSession(null, d);
    },
    editSession: function (el) { var s = findSession(el.getAttribute('data-id')); if (s) openSession(s); },
    pickSport: function (el) {
      readSessionForm();
      var nw = el.getAttribute('data-v'), old = F.sport;
      var v = parseNum(F.distVal);
      if (isFinite(v) && v > 0) {
        if (old !== 'swim' && nw === 'swim') F.distVal = String(Math.round(v * 1000));
        else if (old === 'swim' && nw !== 'swim') F.distVal = distToField(v / 1000, nw);
      }
      F.sport = nw;
      renderSheet();
      var b = $('sheet').querySelector('[data-act="pickSport"][data-v="' + nw + '"]');
      if (b) b.focus();
    },
    pickStatus: function (el) {
      readSessionForm();
      F.status = el.getAttribute('data-v');
      renderSheet();
      var b = $('sheet').querySelector('[data-act="pickStatus"][data-v="' + F.status + '"]');
      if (b) b.focus();
    },
    unlinkAct: function () {
      readSessionForm();
      var s = F.id && findSession(F.id);
      if (s) { if (s.act) dropStream(s.act.key); delete s.act; touch(); persist(); render(); }
      F.act = null;
      renderSheet();
      toast(t('unlinked'));
    },
    saveSession: function () {
      readSessionForm();
      if (!validIso(F.date)) return showSheetErr(t('errDate'));
      var dur = parseNum(F.dur);
      if (!isFinite(dur) || dur < 5 || dur > 900) return showSheetErr(t('errDur'));
      var dv = parseNum(F.distVal);
      var km = isFinite(dv) && dv > 0 ? (F.sport === 'swim' ? dv / 1000 : dv) : 0;
      var data = sanitizeSession({
        id: F.id || uid(), date: F.date, sport: F.sport, type: F.type, dur: Math.round(dur),
        dist: km, zone: F.zone, notes: F.notes, status: F.status, act: F.act
      });
      var s = F.id && findSession(F.id);
      if (s) { for (var k in data) s[k] = data[k]; if (!data.act) delete s.act; }
      else S.sessions.push(data);
      touch(); persist();
      UI.week = mondayOf(data.date);
      closeSheet(); render(); toast(t('saved'));
    },
    dupSession: function () {
      var s = findSession(F.id);
      if (!s) return;
      var c = { id: uid(), date: addDays(s.date, 7), sport: s.sport, type: s.type, dur: s.dur, dist: s.dist, zone: s.zone, notes: s.notes, status: 'planned' };
      S.sessions.push(c);
      touch(); persist();
      closeSheet(); render(); toast(t('duplicated'));
    },
    delSession: function (el) {
      if (!confirmStep('delSession', el)) return;
      S.sessions = S.sessions.filter(function (s) { return s.id !== F.id; });
      touch(); persist(); pruneStreams(); closeSheet(); render(); toast(t('deleted'));
    },
    copyPrev: function () {
      var from = addDays(UI.week, -7), to = addDays(UI.week, -1);
      var src = sessionsIn(from, to);
      if (!src.length) return toast(t('nothingToCopy'));
      src.forEach(function (s) {
        S.sessions.push({ id: uid(), date: addDays(s.date, 7), sport: s.sport, type: s.type, dur: s.dur, dist: s.dist, zone: s.zone, notes: s.notes, status: 'planned' });
      });
      touch(); persist(); render(); toast(t('copied', { n: src.length }));
    },
    newRace: function () { openRace(null); },
    editRace: function (el) { var r = findRace(el.getAttribute('data-id')); if (r) openRace(r); },
    pickPrio: function (el) {
      readRaceForm();
      F.priority = el.getAttribute('data-v');
      renderSheet();
      var b = $('sheet').querySelector('[data-act="pickPrio"][data-v="' + F.priority + '"]');
      if (b) b.focus();
    },
    saveRace: function () {
      readRaceForm();
      if (!F.name.trim()) return showSheetErr(t('errName'));
      if (!validIso(F.date)) return showSheetErr(t('errDate'));
      var data = sanitizeRace({ id: F.id || uid(), date: F.date, name: F.name, format: F.format, priority: F.priority, location: F.location });
      var r = F.id && findRace(F.id);
      if (r) { for (var k in data) r[k] = data[k]; } else S.races.push(data);
      touch(); persist(); closeSheet(); render(); toast(t('raceSaved'));
    },
    delRace: function (el) {
      if (!confirmStep('delRace', el)) return;
      S.races = S.races.filter(function (r) { return r.id !== F.id; });
      touch(); persist(); closeSheet(); render(); toast(t('deleted'));
    },
    period: function (el) { UI.period = +el.getAttribute('data-p'); render(); },
    lang: function (el) { S.lang = el.getAttribute('data-l'); persist(); render(); },
    toggleExport: function () { UI.showExport = !UI.showExport; render(); },
    copyExport: function () {
      var ta = $('exportTxt');
      var txt = ta.value;
      function fallback() {
        ta.focus(); ta.select();
        try { ta.setSelectionRange(0, txt.length); } catch (e) { /* ignoré */ }
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        toast(ok ? t('copiedOk') : t('copySel'));
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { toast(t('copiedOk')); }, fallback);
      } else fallback();
    },
    importJson: function (el) {
      var txt = $('importTxt').value.trim();
      var data = null;
      if (txt) { try { data = sanitize(JSON.parse(txt)); } catch (e) { data = null; } }
      if (!data) { $('importErr').textContent = t('importErr'); return; }
      $('importErr').textContent = '';
      if (!confirmStep('importJson', el)) return;
      data.sample = false;
      S = data;
      persist();
      pruneStreams();
      UI.week = mondayOf(todayIso());
      UI.showExport = false;
      render(); toast(t('importOk'));
    },
    loadSample: function (el) {
      if (!confirmStep('loadSample', el)) return;
      var auto = S.coros.auto, zonesPref = S.zones;
      S = sanitize(sampleData(S.lang));
      S.sample = true;
      S.coros.auto = auto;
      S.zones = zonesPref;
      persist();
      pruneStreams();
      UI.week = mondayOf(todayIso());
      UI.showExport = false;
      render(); toast(t('sampleLoaded'));
    },
    clearAll: function (el) {
      if (!confirmStep('clearAll', el)) return;
      S = { v: 1, lang: S.lang, sample: false, sessions: [], races: [], coros: { auto: S.coros.auto, last: 0, seen: [] }, zones: S.zones };
      persist();
      pruneStreams();
      UI.showExport = false;
      render(); toast(t('cleared'));
    },
    corosSync: function () { corosSync(false); },
    analyze: function (el) { readSessionForm(); openAnalysis(el.getAttribute('data-id')); },
    anTab: function (el) {
      UI.an.tab = el.getAttribute('data-v');
      renderSheet();
      var b = $('sheet').querySelector('[data-act="anTab"][data-v="' + UI.an.tab + '"]');
      if (b) b.focus();
    },
    anLoadCoros: function () { var s = findSession(UI.an.id); if (s && s.act) corosLoadDetail(s); },
    openImport: function () { UI.imp = { stage: 'pick' }; openSheet('import'); },
    impReset: function () { UI.imp = { stage: 'pick' }; renderSheet(); },
    impApply: function () { applyImport(); },
    closeSheet: function () { closeSheet(); }
  };

  var changes = {
    impFiles: function (el) { var files = Array.prototype.slice.call(el.files || []); el.value = ''; handleImportFiles(files); },
    impSport: function (el) {
      var it = UI.imp.items[+el.getAttribute('data-i')];
      it.sport = el.value;
      renderSheet();
    },
    impChoice: function (el) {
      var it = UI.imp.items[+el.getAttribute('data-i')];
      it.choice = el.value;
      renderSheet();
      var r = $('sheet').querySelector('input[name="ch' + el.getAttribute('data-i') + '"]:checked');
      if (r) r.focus();
    },
    zoneOv: function (el) {
      var k = el.getAttribute('data-k'), patch = {};
      Object.keys(S.zones).forEach(function (x) { patch[x] = S.zones[x]; });
      patch[k] = el.value;
      S.zones = sanitizeZones(patch);
      el.value = S.zones[k] == null ? '' : String(S.zones[k]).replace('.', S.lang === 'fr' ? ',' : '.');
      persist();
      toast(t(S.zones[k] == null ? 'zAutoSet' : 'zSaved'));
    },
    corosAuto: function (el) {
      S.coros.auto = el.checked;
      persist();
      if (S.coros.auto) corosSync(true);
    },
    jsonFile: function (el) {
      var f = el.files && el.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { $('importTxt').value = String(r.result || ''); };
      r.readAsText(f);
      el.value = '';
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = actions[el.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest('[data-chg]');
    if (!el) return;
    var fn = changes[el.getAttribute('data-chg')];
    if (fn) fn(el, e);
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.tagName === 'LABEL' && e.target.getAttribute('for')) {
      e.preventDefault();
      var inp = $(e.target.getAttribute('for'));
      if (inp) inp.click();
      return;
    }
    if (!UI.sheet) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    else if (e.key === 'Tab') trapFocus(e);
  });

  render();
  corosInit();
})();
</script>
</body>
</html>
